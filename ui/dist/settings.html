<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Swarm</title>
  <style>:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, #ffffff);
  --bg-card: var(--color-background-secondary, #f6f7f9);
  --bg-muted: var(--color-background-tertiary, #eceef2);
  --text: var(--color-text-primary, #171717);
  --text-muted: var(--color-text-secondary, #52525b);
  --border: var(--color-border-primary, #e4e4e7);
  --accent: var(--color-background-info, #2563eb);
  --accent-text: var(--color-text-info, #1d4ed8);
  --ok: var(--color-text-success, #15803d);
  --warn: var(--color-text-warning, #b45309);
  --danger: var(--color-text-danger, #b91c1c);
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
  font-size: 13px;
  line-height: 1.45;
}

.container {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 68px;
}

.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.title-group h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.subtitle {
  margin: 2px 0 0;
  color: var(--text-muted);
  font-size: 12px;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}

.tab-btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  border-radius: 7px;
  padding: 6px 12px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tab-btn:hover {
  background: var(--bg-card);
  color: var(--text);
}

.tab-btn.active {
  background: var(--bg-card);
  border-color: var(--border);
  color: var(--text);
  font-weight: 600;
}

.badge {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--bg-muted);
  color: var(--text-muted);
}

.badge.running {
  background: var(--accent);
  color: #ffffff;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  margin: 0;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg);
}

.status-pill.ok,
.status-pill.completed {
  color: var(--ok);
}

.status-pill.warn,
.status-pill.cancelled {
  color: var(--warn);
}

.status-pill.running {
  color: var(--accent-text);
}

.status-pill.failed {
  color: var(--danger);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}

input[type='text'],
input[type='number'],
select {
  width: 100%;
  padding: 7px 9px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font: inherit;
}

input:focus,
select:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}

.segmented {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.seg-btn {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  border-radius: 6px;
  padding: 4px 8px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.seg-btn.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  font-weight: 600;
}

.btn {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 7px;
  padding: 6px 12px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}

.btn.sm {
  padding: 3px 8px;
  font-size: 12px;
}

.btn:hover:not(:disabled) {
  background: var(--bg-muted);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.btn.danger {
  color: var(--danger);
}

.role-card,
.task-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.role-badge {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--bg-muted);
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.chip {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--bg-muted);
  color: var(--text);
}

.add-role-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.footer-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.footer-actions {
  display: flex;
  gap: 8px;
}

.hint {
  font-size: 11px;
  color: var(--text-muted);
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

pre.output-box {
  margin: 0;
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 220px;
  overflow: auto;
}

details summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--accent-text);
  user-select: none;
}

.empty-state {
  text-align: center;
  padding: 24px 12px;
  color: var(--text-muted);
}

.board-members,
.board-messages {
  list-style: none;
  padding: 0;
  margin: 12px 0;
}

.board-members li {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 4px;
}

.board-message {
  border-top: 1px solid var(--border);
  padding: 9px 0;
}

.board-message-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message-error,
#board-error {
  color: var(--danger);
}

#board-form {
  display: grid;
  gap: 6px;
}

#board-instruction {
  width: 100%;
  resize: vertical;
  font: inherit;
  padding: 8px;
}

#board-feed {
  max-height: 52vh;
  overflow-y: auto;
}

#board-post-status:empty {
  display: none;
}

.header-actions,
.language-picker {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-actions {
  flex-wrap: wrap;
}

.language-picker select {
  width: auto;
  padding: 4px 7px;
}
</style>
